name: Deploy asset gallery to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gallery and validation videos only
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            gallery
            batch*/**/sim-video
          sparse-checkout-cone-mode: false
          filter: blob:none
          lfs: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          test -f gallery/index.html
          mkdir -p _site
          cp -a gallery/. _site/
          for batch in batch*/; do
            if find "$batch" -type d -name sim-video -print -quit | grep -q .; then
              cp -a "$batch" _site/
            fi
          done
          touch _site/.nojekyll
      - name: Upload gallery artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
