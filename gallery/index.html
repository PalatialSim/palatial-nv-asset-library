function pointerFine(){return window.matchMedia('(hover: hover) and (pointer: fine)').matches}function draw(){const q=search.value.toLowerCase();const filtered=assets.filter(a=>(!batch.value||a.batch===batch.value)&&(!articulationFilter.value||a.articulation===articulationFilter.value)&&[a.name,a.id].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=`${filtered.length} shown · ${assets.length} assets`;grid.replaceChildren();for(const a of filtered){const card=document.createElement('article');card.className='card';const link=document.createElement('a');link.href=(collision&&a.collision_url?a.collision_url:a.render_url)+`?v=${a.rendered_at||0}`;link.target='_blank';const media=document.createElement('div');media.className='media';const img=document.createElement('img');img.loading=collision?'eager':'lazy';img.src=link.href;img.alt=`${a.name} ${collision?'collision geometry':'rendered view'}`;link.append(img);media.append(link);if(a.video_url){const preview=document.createElement('video');preview.className='preview-video';preview.muted=true;preview.loop=true;preview.playsInline=true;preview.preload='none';preview.addEventListener('playing',()=>preview.classList.add('is-playing'));preview.addEventListener('error',()=>preview.classList.remove('is-playing'));preview.setAttribute('aria-label',`${a.name} simulation video preview`);media.append(preview);card.addEventListener('pointerenter',()=>{if(pointerFine()){preview.src=a.video_url;preview.play().catch(()=>preview.classList.remove('is-playing'))}});card.addEventListener('pointerleave',()=>{preview.pause();preview.classList.remove('is-playing');preview.removeAttribute('src');preview.load()});card.addEventListener('focusin',()=>{if(pointerFine()){preview.src=a.video_url;preview.play().catch(()=>preview.classList.remove('is-playing'))}});card.addEventListener('focusout',()=>{preview.pause();preview.classList.remove('is-playing');preview.removeAttribute('src');preview.load()})}card.append(media);const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='name';name.textContent=a.display_name;info.append(name);const sub=document.createElement('div');sub.className='sub';sub.textContent=`${a.batch.replace('batch','Batch ')} · ${(a.name.match(/^D[0-9]+/)||[a.id])[0]}`;info.append(sub);const physics=document.createElement('div');physics.className='sub';physics.textContent=(a.physics_label?a.physics_label+' · ':'')+(a.articulation==='yes'?'Moving joints':a.articulation==='no'?'No moving joints':'Joints not checked');info.append(physics);const bounds=document.createElement('div');bounds.className='sub';if(a.bounds&&a.bounds.size){const b=a.bounds.size.map(v=>v.toFixed(3)).join(' × ');bounds.textContent=`Bounds: ${b} m`;bounds.title='World-space X × Y × Z bounds in metres; up axis: '+(a.up_axis||'see USD');}else{bounds.textContent='Bounds unavailable';bounds.title='No bounds were present in the asset physics metadata';}info.append(bounds);if(collision&&!a.collision_url){const note=document.createElement('div');note.className='sub';note.textContent='Beauty preview · collision view pending';info.append(note)}if(collision){const count=document.createElement('div');count.className='sub';count.textContent=`${a.collider_prims??'Unknown'} collider prims`;info.append(count)}if(a.collision_alignment_issue){const issue=document.createElement('div');issue.className='sub';issue.style.color='#a04424';issue.textContent='Collision alignment issue in source asset';info.append(issue)}if(a.video_url){const video=document.createElement('a');video.href=a.video_url;video.target='_blank';video.textContent=a.video_label||'Simulation video';video.className='sub';info.append(video)}card.append(info);grid.append(card)}}
search.addEventListener('input',draw);batch.addEventListener('change',()=>{setBatch(batch.value);draw()});articulationFilter.addEventListener('change',draw);document.getElementById('toggle').addEventListener('click',e=>{collision=!collision;e.target.textContent=collision?'Show rendered views':'Show collisions';draw()});draw();</script>
<dialog id="montageDialog" aria-labelledby="montageTitle" data-montage-base="https://palatialsim.github.io/palatial-nv-asset-library/" data-local-batch1="true">
  <header class="sheet-heading"><div><h2 id="montageTitle">Batch montage</h2><p id="montageCount"></p></div><button id="closeMontage" aria-label="Close montage">✕</button></header>
  <div class="sheet-controls">
    <div class="sheet-navigation"><button id="prevMontage" aria-label="Previous batch">←</button><button id="nextMontage" aria-label="Next batch">→</button></div>
    <div class="segmented" role="group" aria-label="Montage view"><button data-montage-kind="render" aria-pressed="true">Rendered</button><button data-montage-kind="colliders" aria-pressed="false">Collisions</button></div>
    <button id="fitMontage" aria-pressed="false">Fit sheet</button>
    <a id="fullMontage" target="_blank" rel="noopener">Open full size ↗</a>
    <button id="montageAssets">View these assets</button>
  </div>
  <div id="sheetViewport" class="sheet-viewport" tabindex="0" aria-label="Montage image"><p id="sheetStatus" role="status">Loading montage…</p><img id="sheetImage" alt="" hidden></div>
</dialog>
<script src="montages.js"></script>
